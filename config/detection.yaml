  - [1280, 0]
  - [1280, 720]
  - [0, 720]
  preset: 1

# Self-slew (PTZ-on-positive) — for cameras that both detect AND pan.
# Keyed by CAMERA_ID. Polygon points are NORMALIZED (0.0-1.0) so they
# survive INPUT_WIDTH/HEIGHT changes. See src/stream/self_slew.py for
# the state machine + coordination hazards.
#
# Prereq: presets 1..N must be saved on the camera itself via its
# onboard PTZ web UI before enabling. Preset 1 is home (wide scene).
slew:
  backyard:
    # Off until presets are saved on the camera and polygons are drawn
    # to match. Flip to true after that one-time bootstrap.
    enabled: false
    camera_id: 2                  # PTZ command target (PTZ_HOST_2 in env)
    home_preset: 1
    return_home_after_s: 30
    lockout_seconds: 10
    transition_pause_s: 2.0
    # Placeholder — replace with real zone polygons once the operator
    # walks the camera through its saved presets and marks each field.
    presets:
      - name: placeholder_full_frame
        polygon: [[0.0, 0.0], [1.0, 0.0], [1.0, 1.0], [0.0, 1.0]]
        preset: 2
