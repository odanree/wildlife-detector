# Frontend CI gate — runs on any PR/push touching the React app or the
# Dockerfile that bakes it in. Fails fast on lint, typecheck, build, and
# Docker multi-stage build so we catch "works on my machine" drift at
# the trust boundary (PR review) instead of during a prod deploy.
#
# Pattern: fail-fast at the CI trust boundary. Each job is independent so
# a lint failure doesn't hide a typecheck failure — reviewer sees the
# full contract-violation surface in one run.

name: frontend

on:
  # Manual escape hatch — see antipattern-counts.yml for rationale.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docker/web/Dockerfile"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "docker/web/Dockerfile"
      - ".github/workflows/frontend.yml"

# Prevent redundant runs when someone force-pushes to a PR branch.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: biome + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Prefer --frozen-lockfile once bun.lock is committed. Falls back to
      # unpinned install for the pre-lockfile transition (first CI run
       # after switching from npm). Follow-up PR pins the lock.
      - run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
      - name: Biome lint + format check
        run: bun run lint
      - name: TypeScript typecheck
        run: bun run typecheck

  antipattern-lint:
    # Tier-1 counter: runs eslint-plugin-react-you-might-not-need-an-effect
    # against PR head AND base, HARD-FAILS the check on any delta > 0
    # (and posts a PR comment with the diff). Prior version was
    # comment-only and let PR #43 through with +4 findings unnoticed.
    #
    # Numeric-compare via bash `-gt` — GitHub Actions template `>`
    # compares strings, so "9" > "13" would return true. Bash `-gt`
    # is numeric.
    #
    # Only meaningful on PRs — pushes to main go through the counts
    # workflow (.github/workflows/antipattern-counts.yml) which records
    # the merged count to .audit/counts.jsonl for the time-series.
    name: react anti-pattern delta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
      - name: Count anti-patterns on PR head
        id: head_count
        run: |
          # `bun run` prefixes stdout with the invoked-script line
          # ($ bun x eslint ...). Take the LAST line so the count is
          # clean numeric — prior version captured multi-line and broke
          # the numeric compare below (silently letting regressions
          # through — see PR that added this comment).
          count=$(bun run lint:antipatterns:count 2>/dev/null | tail -n 1 || echo 0)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "PR head: $count you-might-not-need-an-effect findings"
      - name: Checkout base branch
        # `git checkout <ref> -- <paths>` overwrites tracked files with
        # the base version but does NOT delete files that exist on
        # HEAD but not on <ref>. Without `git clean -fd`, any file the
        # PR adds (canary or real) survives into the base-count eslint
        # run, inflating base_count to match head_count → delta 0 →
        # gate silently passes. Discovered on the sticky-comment test
        # PR (#58) which added a new anti-pattern file and unexpectedly
        # got a green gate. `git clean -fd src` removes any untracked
        # files inside src (my canary was one), respecting .gitignore
        # so node_modules stays intact.
        run: |
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
          git checkout refs/remotes/origin/${{ github.base_ref }} -- src eslint.config.js package.json 2>/dev/null || true
          git clean -fd src 2>/dev/null || true
      - name: Count anti-patterns on base branch
        id: base_count
        run: |
          # If base doesn't have eslint.config.js yet (first PR introducing
          # this workflow), treat base count as 0 so the delta reflects
          # everything the PR is introducing.
          if [ ! -f eslint.config.js ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "Base branch has no eslint.config.js — treating base count as 0"
          else
            count=$(bun run lint:antipatterns:count 2>/dev/null | tail -n 1 || echo 0)
            echo "count=$count" >> "$GITHUB_OUTPUT"
            echo "Base: $count findings"
          fi
      - name: Fail on delta increase
        # HARD FAIL when the PR adds tier-1 findings. Prior version only
        # posted a comment (continue-on-error implicit via lack of a
        # failing step), which let PR #43 through with +4 findings
        # unnoticed. Bash-arithmetic compare so "16" > "13" numerically,
        # not lexically.
        run: |
          head=${{ steps.head_count.outputs.count }}
          base=${{ steps.base_count.outputs.count }}
          echo "Head: $head, Base: $base"
          if [ "$head" -gt "$base" ]; then
            delta=$((head - base))
            echo "::error::Anti-pattern regression: PR adds $delta new react-you-might-not-need-an-effect finding(s). Base=$base Head=$head"
            echo "Run 'bun run lint:antipatterns' locally to see offending lines. See #36 for the pattern class + PR #29 for the canonical fix shape."
            exit 1
          fi
          echo "OK — no regression (delta ≤ 0)."
      - name: Sticky comment (post on regression, delete when green)
        # Always runs — same script handles both branches (regression =
        # post/update, no-regression = delete stale comment). This is why
        # we drop the previous `if: failure()` gate on the comment step:
        # a subsequent green run needs to clean up its own stale comment
        # from an earlier failing run, otherwise the operator sees
        # "regression detected" long after the PR was fixed and merged
        # (which is exactly what happened on PR #56).
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const head = ${{ steps.head_count.outputs.count }};
            const base = ${{ steps.base_count.outputs.count }};
            const delta = head - base;
            // Marker line lets us find our own prior comment (if any)
            // without a database. Hidden in HTML comment so operators
            // don't see the mechanism.
            const MARKER = '<!-- antipattern-delta-sticky -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Find the existing sticky comment, if any.
            const existing = (await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            )).find((c) => c.body && c.body.includes(MARKER));
            if (delta > 0) {
              const body = [
                MARKER,
                '### Anti-pattern regression detected',
                '',
                `This PR adds **${delta}** new \`react-you-might-not-need-an-effect\` finding${delta === 1 ? '' : 's'}.`,
                '',
                `| Ref | Count |`,
                `|---|---|`,
                `| Base (\`${{ github.base_ref }}\`) | ${base} |`,
                `| PR head | ${head} |`,
                `| **Delta** | **+${delta}** |`,
                '',
                'Run `bun run lint:antipatterns` locally to see the offending lines and fix shape. See #36 for the pattern class and PR #29 for the canonical fix shape.',
                '',
                `<sub>Updated at ${new Date().toISOString()}. This comment auto-deletes once the PR is fixed.</sub>`,
              ].join('\n');
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } else if (existing) {
              // Green now — remove the stale regression comment so the
              // PR page reflects current state.
              await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
            }

  build:
    name: vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Prefer --frozen-lockfile once bun.lock is committed. Falls back to
      # unpinned install for the pre-lockfile transition (first CI run
       # after switching from npm). Follow-up PR pins the lock.
      - run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
      - name: Build production bundle
        run: bun run build
      - name: Verify dist output exists
        run: |
          test -f dist/index.html
          test -d dist/assets

  docker-web-build:
    name: docker web (multi-stage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image (both stages)
        # Verifies the bun→python multi-stage build works end-to-end so
        # "vite build passes locally but Docker build breaks" is caught
        # here rather than during `docker compose build` on the host.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
