# wildlife-detector — three-plane architecture from ADR-002 mapped to docker-compose.
#
# services:
#   detector-yard    → RTSP 192.168.1.86; MOG2/YOLO + cascade VLM; internal HTTP 8101
#   detector-rooftop → RTSP 192.168.1.145; larger-only detection (raccoon/cat); 8102
#   web              → Flask UI on 8100; aggregates state + status across cameras
#
# Trust boundaries (unchanged from single-camera + process-split path):
#   - Web → detector writes are bearer-token-gated (INTERNAL_API_TOKEN in .env)
#   - Each detector's internal HTTP is loopback-only inside the compose network
#   - Detector reaches Ollama on the host via host.docker.internal:11434
#
# Shared state (both detectors write, web reads):
#   - state.db      — camera_id column tags each alert row
#   - snapshots/    — subdirs per camera-id under the alert filename
#
# Per-camera overrides live in each service's environment block (below), so
# only INTERNAL_API_TOKEN, ANTHROPIC_API_KEY, and cascade backend config need
# to be in .env. Everything camera-scoped is compose-owned.
#
# Bring up:
#   docker compose up -d --build
#   docker compose logs -f detector-yard    # or detector-rooftop, or web
#
# Bring down without losing state:
#   docker compose down
#
# Bring down and wipe state:
#   docker compose down -v

x-detector-common: &detector-common
  build:
    context: .
    dockerfile: docker/detector/Dockerfile
  restart: unless-stopped
  env_file:
    # DATABASE_URL and POSTGRES_* live in .env — NOT hoisted into an
    # `environment:` block here because YAML anchor merge (<<:) does NOT
    # recursively merge nested mappings. Each detector service defines
    # its own `environment:` for CAMERA_ID etc., which would clobber the
    # anchor's DATABASE_URL entry. env_file merges cleanly with per-
    # service environment blocks (per Docker Compose semantics), so
    # keeping shared config in .env is the least-surprise path.
    - .env
  depends_on:
    postgres:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./data:/app/data
    - ./snapshots:/app/snapshots
    - ./logs:/app/logs
    - ./clips:/app/clips
    - models:/app/models
    - ./config:/app/config

services:
  # Postgres backing store — replaces the SQLite bind-mount we hit 3
  # times in ~10 days for "unable to open database file" (9P + SQLite
  # POSIX-lock impedance mismatch on Docker Desktop WSL2). TCP
  # connections have no such hazard; host-side tools can hit it
  # freely without breaking containers.
  #
  # Named volume (not bind mount) so the DB lives inside the WSL2
  # ext4 filesystem — no 9P layer between anyone and the data.
  # Trade-off: `scp state.db` portability is gone, replaced with
  # `pg_dump` (net win, since pg_dump is online-safe).
  postgres:
    image: postgres:16-alpine
    container_name: wildlife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wildlife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wildlife}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wildlife} -d ${POSTGRES_DB:-wildlife}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      # Exposed on host loopback so the sandbox harness + DBeaver/psql can
      # hit it without going through `docker compose exec`. Bound to
      # 127.0.0.1 (not 0.0.0.0) so it's not reachable from LAN. Compose
      # network still reaches it as `postgres:5432` regardless.
      #
      # Host port 5433 (not 5432) — 5432 is often occupied on dev
      # machines by other projects' postgres. Override via env if you
      # want a different port.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  # ── Daily pg_dump backup sidecar ────────────────────────────────────
  # Wakes once a day, dumps the DB to ./backups/wildlife-YYYY-MM-DD.dump
  # (custom format, compressed), then prunes anything older than 14
  # days. Bind-mounted to host so backups survive a volume wipe — the
  # exact failure mode that motivated this after Aug 5 2026's prune
  # wiped pg-data.
  #
  # Pattern: **infrastructure-as-code backup discipline** — cron lives
  # in the repo, not in Windows Task Scheduler / host cron. Portable
  # across any machine that runs the compose file.
  #
  # Failure mode: dump fails silently on individual runs (network blip,
  # postgres down) — the sleep loop keeps trying tomorrow. Watch with
  # `docker compose logs pg-backup`.
  pg-backup:
    image: postgres:16-alpine
    container_name: wildlife-pg-backup
    restart: unless-stopped
    environment:
      # PGPASSWORD is the standard convention for scripted pg_dump auth.
      # Reuses the same POSTGRES_PASSWORD the DB itself uses.
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGUSER: ${POSTGRES_USER:-wildlife}
      PGDATABASE: ${POSTGRES_DB:-wildlife}
      PGHOST: postgres
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # Runs pg_dump immediately on start (so `docker compose up` produces
    # a fresh backup within seconds), then daily at 24h intervals. The
    # inline `set -e` guards so a failed dump doesn't get counted as
    # "pruned" — we want visible errors, not silent gaps.
    command: >
      sh -c 'set -e;
      while true; do
        OUT=/backups/wildlife-$$(date +%Y-%m-%d-%H%M).dump;
        echo "[backup] dumping to $$OUT";
        pg_dump -F c -f $$OUT && echo "[backup] ok $$OUT ($$(du -h $$OUT | cut -f1))";
        find /backups -name "wildlife-*.dump" -mtime +14 -delete;
        sleep 86400;
      done'

  detector-yard:
    <<: *detector-common
    container_name: wildlife-detector-yard
    environment:
      # Camera identity — tags alert rows, drives baseline + snapshot paths.
      CAMERA_ID: yard
      # Explicit zone_key so the yaml default doesn't accidentally get shared
      # if we later rename the default.
      ZONE_KEY: yard_zone
      # RTSP source. 2026-08-09: replaced the original 1080p H.264
      # cam at .86 with a Reolink 4K HEVC at .104 (same physical
      # mount, same NVR channel 5). Old URL:
      #   rtsp://admin:123456@192.168.1.86:554/stream1
      # New URL is HEVC main-stream — ffprobe shows 3840x2160 @ 25fps.
      # Sub-stream (h264, 896x512) would be cheaper decode but LOWER
      # resolution than the old cam's 1080p, so we'd lose small-target
      # detail. Keep main + bump INPUT_WIDTH if you see MOG missing
      # rats after the swap.
      RTSP_URL: rtsp://admin:windows98@192.168.1.104:554/h264Preview_01_main
      # Per-mode baseline files: derives baseline_day.jpg + baseline_night.jpg.
      # Keeping the legacy path so existing baselines migrate for free.
      BASELINE_PATH: data/baseline.jpg
      # 4K source (Reolink swap 2026-08-09) → downsample to 2048x928
      # to preserve small-target detail. Old cam was 1080p and the
      # yaml default 1280x720 was fine, but 4K → 1280x720 is a 3x
      # downsample that costs meaningful pixels-per-rat. Matches
      # rooftop + backyard which are also 4K sources.
      INPUT_WIDTH: "2048"
      INPUT_HEIGHT: "928"
      # Reolink's IR illumination at night is much brighter than the
      # old cam — mean grayscale routinely > 100 even at 23:00 PDT
      # with no daylight. Default DAY_NIGHT_BRIGHTNESS_THRESHOLD=100
      # makes the baseline picker classify IR night as "day", load
      # the stale day baseline, and apply the strict 0.18 threshold.
      # Bumping to 150 makes the picker correctly identify IR frames
      # as night (uses 0.06 threshold + night baseline).
      DAY_NIGHT_BRIGHTNESS_THRESHOLD: "150"
      # Daytime is dominated by shadow FPs (side-angle view, long cast
      # shadows on brick + wall from swaying trees). Rooftop is unaffected
      # because its overhead geometry has no cast shadows. Skip entire
      # detection path when mean frame brightness >= 150 (matches the
      # baseline picker's day/night boundary). Preview still publishes
      # with a "detection paused (daytime)" banner.
      SKIP_DAYTIME_DETECTION: "1"
      # Two-signal daytime — brightness OR local time-of-day. Reolink
      # auto-exposure sits yard at grayscale ~108 at 3PM (shaded view),
      # below the baseline picker's 150. Split thresholds so baseline
      # picker stays at 150 (correct for night IR ~100) while daytime
      # skip trigger uses 90. Time-of-day belt-and-suspenders catches
      # overcast dawn/dusk when brightness reads night-like.
      DAYTIME_SKIP_BRIGHTNESS_THRESHOLD: "90"
      SKIP_DAYTIME_START_HOUR: "7"
      SKIP_DAYTIME_END_HOUR: "19"
      TZ: America/Los_Angeles
      # Yard is optimized for rodent detection — small bbox floor.
      MIN_MOTION_BBOX_PX: "22"
      # VLM per-track throttle: 3s between VLM calls for the same
      # track_id. Bumped from default 2s to cut spam on high-motion
      # scenes while still catching quick-passing rats (typical rat
      # transit ≥ 5s, so one VLM call within that window still fires).
      VLM_INTERVAL_S: "3"
      # Insect brightness pre-filter — bbox mean grayscale above this
      # threshold classified as insect (moth wings reflect IR/light),
      # skip VLM entirely. Was 110 pre-tuning; lowered to 100 08/11 after
      # Reolink ISP tuning (Brightness 128→90, contrast up, NR down)
      # dropped the overall scene brightness — moths that used to render
      # at mean 130+ now render at 70-100 and were slipping past 110.
      # Raised 100 → 110 08/12 after cat labels came in. Real cats can
      # generate small partial-body-crop bboxes (only a paw/tail/patch
      # of fur visible after MOG); those partial crops happen to hit
      # mean=98 when the cat is next to IR-lit surface. Threshold=100
      # had a 1-point buffer above that ceiling — too tight. 110 gives
      # 11pt buffer above real cat max, 22pt above rodent max (88).
      NIGHT_INSECT_BRIGHTNESS_MIN: "110"
      # Uncap the size restriction on the mean-brightness gate. Data
      # analysis 08/11 (n=71 rodents, n=539 FPs): backyard FPs cluster at
      # mean 100-190 with many bboxes > 2000 px (wall reflections, IR-lit
      # foliage) that were escaping the size-capped insect filter. Rodent
      # ceiling (mean=88 on yard, 93 on backyard) is well below threshold=
      # 100. Max + elongation gates STAY size-capped (rodents with
      # eyeshine hit max=255 legitimately at any size).
      INSECT_MEAN_UNCAP_SIZE: "1"
      # Yard's side-angle view has stable non-foliage background — MOG2
      # defaults (variance-based) work well; conservative threshold keeps
      # shadow-jitter FPs down.
      MOTION_BACKEND: mog2
      MOTION_HISTORY: "400"
      MOTION_VAR_THRESHOLD: "18"
      MOTION_MIN_AREA: "80"
      # VLM-reject alert: fire on every non-insect motion, regardless of
      # VLM verdict. Per user 08/10: "classification isn't important, we
      # just need it to fire an alert for human labeling". Old yard cam
      # (1080p H.264) fired reliably on rats even when misclassified;
      # Reolink 4K swap + qwen 7b size-bias regressed that. This restores
      # the pre-Reolink alert coverage — cats + rats + anything non-insect
      # crosses → alert fires. Insect gate + chaos-gate still filter noise.
      #
      # Requires PR #96's bypass_min_confidence flag or overrides get
      # silently dropped by notifier.min_confidence.
      VLM_REJECT_ALERT_MIN_AREA_PX: "0"
      # detectShadows=0: MOG shadow classification is OFF.
      # Rationale (08/10): PR #99 introduced aggressive shadow filter
      # (tau=0.4) to kill daytime shadow FPs. PR #100/#101 then added
      # full daytime detection skip (7-19 local), which handles the
      # daytime FP window at the pipeline layer. The shadow filter is
      # now redundant during day AND risks classifying dark rodent
      # bodies at night as shadows (rat/mouse fur reads at 40-60% of
      # IR-lit background → hits shadow classifier → filtered → miss).
      # Nighttime is the only detection window we care about here, so
      # OFF is the safest default.
      MOTION_DETECT_SHADOWS: "0"
      BASELINE_DIFF_THRESHOLD: "0.06"
      DAY_BASELINE_DIFF_THRESHOLD: "0.18"
      # Ollama qwen2.5vl:7b returns rodent confidence 0.4-0.7 typically;
      # the default 0.95 daytime-rodent gate rejected effectively all
      # daytime detections (funnel showed 515 VLM calls → 0 hits during
      # a 15:30 PST afternoon window). Middle ground — 0.55 — more
      # conservative than rooftop's 0.40 but not the default cliff.
      # If daytime rats get missed, drop to 0.40 to match rooftop.
      DAYTIME_RODENT_MIN_CONF: "0.55"
      # Yard chair FP mitigation (2026-08-07): YOLO was flagging a
      # bar-height chair as `person` at 0.75 conf, triggering
      # human_heartbeat + suppressing all wildlife detection in the
      # frame. Default gate is 0.70; bumping to 0.90 filters the chair
      # while still catching real people (they typically fire at 0.90+
      # on this camera). Follow-up: motion-gate person detections by
      # MOG overlap so static objects can't produce person FPs
      # regardless of conf.
      EXCLUSION_MIN_CONF: "0.90"
      # Cost-cutover: moved yard from cascade to pure Ollama after prod-
      # scale burn showed $2/night. qwen2.5vl:7b handles yard's side-angle
      # rat crops (was working fine as the cascade primary). Loses
      # Sonnet's precision on moth-eyeshine — expect more Pattern 2 FPs
      # to leak through. Zero API cost.
      VLM_BACKEND: ollama
      OLLAMA_MODEL: qwen2.5vl:7b
      # Kept for reference — flip back if Ollama FPs get untenable.
      CLAUDE_MODEL: claude-sonnet-5
      CASCADE_CONFIRM_MODEL: claude-sonnet-5
      # Host services (from base image or .env — repeated here so this file
      # is self-documenting).
      OLLAMA_URL: http://host.docker.internal:11434
      DETECTOR_INTERNAL_HOST: 0.0.0.0
      DETECTOR_INTERNAL_PORT: 8101
    expose:
      - "8101"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8101/internal/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  detector-rooftop:
    <<: *detector-common
    container_name: wildlife-detector-rooftop
    environment:
      CAMERA_ID: rooftop
      # Per-camera zone polygon key — pipeline picks zones[rooftop_zone] out of
      # config/detection.yaml. Placeholder covers bottom half of frame; draw
      # the real polygon via the UI camera selector once wired.
      ZONE_KEY: rooftop_zone
      # Annke 4K camera has a 1200x536 H.264 substream at this path — decode is
      # ~10x cheaper than the 4K HEVC main, and we downsample to 1088x612 anyway
      # so main-stream detail is wasted. NVR-adopted, so creds come from the
      # NVR admin, not the factory default.
      # Main stream (Channels/101) = 4K HEVC. Sub-stream (Channels/102) was
      # low-res + upscale-inflated OSD. Main stream costs ~5-10x decode CPU
      # (fine on 16-core) but keeps OSD proportional and gives Ollama
      # cleaner crops for small overhead animals.
      RTSP_URL: rtsp://admin:windows98@192.168.1.145:554/Streaming/Channels/101
      # Rooftop baselines live in the same data/ volume, keyed by CAMERA_ID.
      BASELINE_PATH: data/baseline_rooftop.jpg
      # Rooftop's 4K source needs higher pipeline resolution to preserve
      # rat-scale detail. Yard's default 1088x612 works fine for the closer
      # side-angle view; rooftop at 4K→1088x612 downsamples rat body to ~15x8
      # px which drops below MOG2's discrimination floor. 2048-wide keeps
      # small-target detail; ~2x CPU on ingest, still comfortable on 16-core.
      INPUT_WIDTH: "2048"
      INPUT_HEIGHT: "928"
      # Rats at overhead angle project as ~15-25 px wide — but a 15 px floor
      # let moths/flying insects (5-50 px in-motion streaks) flood into VLM,
      # where Haiku hallucinates them as cats at ~72%. Raccoons/possums
      # project as 60+ px; a 45 px floor cuts the moth stream without
      # losing the wildlife targets we actually care about at overhead.
      # Ground rats will get missed by rooftop — that's yard's job anyway.
      MIN_MOTION_BBOX_PX: "30"
      # VLM per-track throttle 3s (from 2s default). Rooftop generates
      # more shadow/wind ghosts than yard, so the extra headroom matters
      # more here.
      VLM_INTERVAL_S: "3"
      # Insect brightness pre-filter — bbox mean grayscale above this
      # threshold classified as insect (moth wings reflect IR/light),
      # skip VLM. 110 catches moths on darker backgrounds where 130
      # (code default) let them through. Bump higher if legit bright-lit
      # rodents get flagged.
      NIGHT_INSECT_BRIGHTNESS_MIN: "110"
      # Rooftop was on KNN because MOG2's variance model absorbed slow
      # raccoons crossing wind-blown brush. Retesting MOG2 now that the
      # persistence gate + baseline-diff pre-filter catch downstream
      # FPs — if MOG2 works here, we save ~2.5GB vs KNN=500 (KNN buffer
      # at 2048×928 dominates memory on this container).
      #
      # Aggressive tune:
      # - history=200 → short 13s learning window; foliage variance
      #   gets learned as background quickly, but a slow raccoon that
      #   pauses > 13s could be absorbed. Bump to 400+ if that hits.
      # - var_threshold=8 (vs OpenCV default 16) → picks up subtle
      #   IR-mode intensity changes that a raccoon's fur creates
      #   against brush.
      # - min_area=40 kept for partial-visibility raccoon-peeking.
      #
      # Rollback: MOTION_BACKEND=knn + MOTION_HISTORY=500 restores prior.
      # Reverted to LOOSE config after replay-testing rooftop_raccoon_0009
      # showed the strict tune (var=15 + shadow_filter=on + base=0.12)
      # dropped the raccoon entirely (0 alerts vs 8 with these settings).
      # Running loose in prod for a few hours to gather ground-truth on
      # what wind-shadow FPs actually look like when they cross the
      # funnel. Middle-ground (var=10, base=0.06/0.08, shadow_filter=on)
      # caught 1 alert on the raccoon in the replay if we want to
      # tighten later without losing recall entirely.
      MOTION_BACKEND: mog2
      MOTION_HISTORY: "200"
      MOTION_VAR_THRESHOLD: "8"
      MOTION_DETECT_SHADOWS: "0"
      MOTION_MIN_AREA: "40"
      # Same rationale as yard — VLM-reject alerts are a backyard-only
      # ergonomic. Rooftop's overhead view has strong small-target FP
      # patterns (birds, moths, distant plane lights) that qwen rejects
      # correctly; firing alerts on those rejects would be noise.
      VLM_REJECT_ALERT_MIN_AREA_PX: "999999"
      KNN_DIST2_THRESHOLD: "400"
      # Reverted to loose thresholds after replay-testing showed the
      # 0.08/0.12 tune killed the raccoon (diff=0.116 was just under
      # 0.12). Data-gathering config for a few hours; middle-ground
      # (0.06/0.08) is the fallback if shadow FPs get untenable.
      BASELINE_DIFF_THRESHOLD: "0.05"
      DAY_BASELINE_DIFF_THRESHOLD: "0.05"
      # Yard's 0.95 daytime-rodent gate rejects nearly all overhead rat
      # detections (grainy IR + small target = 0.4-0.6 conf typical).
      # Rooftop's baseline auto-picker also misclassifies IR-lit night as
      # "day" here, compounding the false-reject. Loosen to 0.40 so real
      # rat calls survive; false-positives are already killed by the
      # 30 px size floor + Pattern 3 insect hard-rejects.
      DAYTIME_RODENT_MIN_CONF: "0.40"
      # No PTZ tied to this camera.
      SLEW_ENABLED: "false"
      # VLM_SKIP_DAYTIME was flipped to 1 to cut Sonnet cost, but since
      # we moved to local Ollama (free) the skip just blocks all
      # detection — baseline auto-picker misclassifies IR-lit night as
      # "day" here, so every event silently gets dropped. Back to 0 now
      # that VLM is free.
      VLM_SKIP_DAYTIME: "0"
      # Rooftop bypasses cascade — Ollama qwen2.5vl can't recognize overhead
      # silhouettes, so cascade primary rejected every legitimate positive.
      # Pure Claude single-stage keeps precision manageable.
      #
      # Model choice is a cost-vs-recall tradeoff:
      #   - Opus-4-8: 3/3 recall on overhead rats but ~$0.015/call = high burn
      #     under load. Use when budget allows or for critical eval periods.
      #   - Haiku-4-5: partial recall (misses subtle overhead rats but catches
      #     clear ones) at ~$0.001/call. Good baseline for 24/7 running.
      # Currently on Haiku — flip to opus-4-8 when eval sessions need higher recall.
      # Rooftop VLM stack after cost cutover:
      #   1. Sonnet worked but $6.70/night was too high
      #   2. Ollama 32b times out at 180s/call (needs GPU + 24GB VRAM)
      #   3. Ollama 7b failed on overhead silhouettes in earlier eval
      # Landed on 7b anyway — accept near-zero rooftop confirms rather
      # than 32b timeouts blocking the whole VLM path. Bumps a real GPU
      # or a Sonnet re-enable with strict caps as needed.
      VLM_BACKEND: ollama
      OLLAMA_MODEL: qwen2.5vl:7b
      # Kept as historical fallback.
      CLAUDE_MODEL: claude-sonnet-5
      # Was 5x for Sonnet/Opus context — but on Ollama 7b, a 40 px rat
      # inside a 400 px crop becomes ~10% of the frame → model can't see
      # it. Dropped to 1.5x so the animal fills a meaningful portion of
      # the crop. Still keeps a bit of surrounding context for the
      # "ground contact" and "moving vs static" cues.
      VLM_CROP_PAD_MULT: "1.5"
      VLM_CROP_MIN_PAD: "40"
      # Temporal multi-frame VLM — rooftop-only rollout. Buffers the last
      # N frames and sends the sequence to the VLM so it can reason about
      # MOTION SIGNATURE instead of a single still. Biggest lever for
      # small overhead targets against textured backgrounds (rat crawling
      # along fence slats): a single frame confidently rejects at 0.10
      # conf even with baseline-compare, but the same track across 4
      # frames shows a directed low-speed trajectory that only rodents
      # produce. See src/pipeline.py and src/vlm/analyzer.py (_TEMPORAL_USER_PROMPT).
      #
      # Cost: ~2-3x per-call latency (4 frames vs 1-2). Neutral or better
      # per-track total compute because a temporal hit on the first VLM
      # call eliminates the 6-8 rejected calls the current pipeline
      # emits per active rat in fence area.
      VLM_TEMPORAL_ENABLED: "1"
      VLM_TEMPORAL_FRAMES: "4"
      VLM_TEMPORAL_WINDOW_S: "1.0"
      # Second detector needs its own internal HTTP port — 8102 keeps it
      # outside the 8100/8101 range so port confusion is unlikely.
      OLLAMA_URL: http://host.docker.internal:11434
      DETECTOR_INTERNAL_HOST: 0.0.0.0
      DETECTOR_INTERNAL_PORT: 8102
    expose:
      - "8102"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8102/internal/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── detector-backyard ───────────────────────────────────────────────
  # Third camera (2026-08-08). Side-angle view — inherits yard's motion
  # tuning + VLM prompt path (Pattern 1/2 evidence, not Pattern 3
  # overhead silhouette). Source is a 4K HEVC Hikvision-family cam;
  # downsampled to 2048x928 to preserve small-target detail (yard's
  # 1088x612 would waste 4x resolution).
  detector-backyard:
    <<: *detector-common
    container_name: wildlife-detector-backyard
    environment:
      CAMERA_ID: backyard
      ZONE_KEY: backyard_zone
      # 4K main stream from the Hikvision path — /stream1 on this cam
      # is only 720x480 sub-stream, insufficient for small-target
      # detection.
      RTSP_URL: rtsp://admin:123456@192.168.1.118:554/Streaming/Channels/101
      BASELINE_PATH: data/baseline_backyard.jpg
      # Match yard: skip detection during daytime (shadow FPs dominate on
      # side-angle view). Uses default DAY_NIGHT_BRIGHTNESS_THRESHOLD=100
      # since backyard's IR night mode is dimmer than yard's Reolink.
      SKIP_DAYTIME_DETECTION: "1"
      DAYTIME_SKIP_BRIGHTNESS_THRESHOLD: "90"
      SKIP_DAYTIME_START_HOUR: "7"
      SKIP_DAYTIME_END_HOUR: "19"
      # time_only: brightness signal ignored so backyard resumes detection
      # at exactly 7 PM local, not extended by lingering dusk brightness.
      # User asked for hard 7 PM start.
      DAYTIME_SKIP_TRIGGER_MODE: time_only
      TZ: America/Los_Angeles
      # 4K source → downsample to 2048x928. Same rationale as rooftop:
      # yard's 1088x612 default would collapse a 30 px rat crop to
      # ~8 px, below MOG2's discrimination floor.
      INPUT_WIDTH: "2048"
      INPUT_HEIGHT: "928"
      # Compromise floor between mouse detection and fence-spot FPs.
      # History: 22 (rodent-scale, inherited from yard) → 50 (PR #93,
      # after 71x26 fence spot fired "mouse 85%") → 30 (08/11, after
      # real live mice at 15-25 px were being filtered before VLM).
      # Camera ISP tuning solved most of the underlying eyeshine-signal
      # problem, so the small-bbox FPs are much less noisy now than
      # when PR #93 shipped. 30 keeps small mice through the filter
      # while still rejecting the tiniest noise blobs (< 30 side-length
      # = ~900 px² = usually not-a-real-target).
      MIN_MOTION_BBOX_PX: "30"
      VLM_INTERVAL_S: "3"
      # Bumped 110 → 160 after Aug 9 21:23 fence-rat miss: the backyard
      # fence slats reflect IR strongly (bbox mean_brightness on fence
      # blobs runs 116-182), so the default 110 threshold classified
      # ALL fence detections as moths and skipped VLM. Sandbox A/B on
      # backyard_missed_2123.mp4 with new threshold caught 13 VLM
      # positive rodent decisions vs 0 in the live gap.
      # Lowered 160 → 100 on 08/11 after Jennov ISP tuning (Brightness
      # 128→110, 3D-NR 128→40, Manual shutter) shifted scene brightness
      # down. Labeled dataset analysis (n=17 rodents, n=70 backyard FPs)
      # shows max rodent mean=88, so 100 preserves a 12-point safety
      # buffer while catching most moth-like FPs (median FP mean=118)
      # at the insect stage instead of at VLM/override.
      # Raised 100 → 110 08/12: real cat labels showed max=99 on partial-
      # body-crop bboxes. Threshold=100 had a 1-point buffer above that
      # ceiling. 110 preserves 11pt buffer above cat max, 15pt above
      # backyard rodent max (95).
      NIGHT_INSECT_BRIGHTNESS_MIN: "110"
      # Uncap size on mean-brightness gate — see yard for full rationale.
      # Backyard's dominant FP class is wall reflections + IR-lit foliage
      # at bboxes 45-100+ px wide (well above the 2000 px size cap).
      # Data-driven: threshold=100 preserves 7-point buffer above max
      # backyard rodent mean (93).
      INSECT_MEAN_UNCAP_SIZE: "1"
      # Enable temporal multi-frame VLM (validated on rooftop in PR #73).
      # Backyard has the same evidence-starvation failure mode against
      # its IR-lit fence backdrop — VLM confidently rejects single-frame
      # rat crops at conf=0.10. Multi-frame gives motion signature
      # across 4 successive frames so the VLM has real class-diagnostic
      # information. Same overhead cost as rooftop (~2-3x per call).
      VLM_TEMPORAL_ENABLED: "1"
      VLM_TEMPORAL_FRAMES: "4"
      VLM_TEMPORAL_WINDOW_S: "1.0"
      MOTION_BACKEND: mog2
      MOTION_HISTORY: "400"
      MOTION_VAR_THRESHOLD: "18"
      MOTION_MIN_AREA: "80"
      # detectShadows=0: same rationale as yard — daytime skip handles
      # the FP window this was filtering, and shadow classifier risks
      # rejecting dark rodents at night. See yard's env for full context.
      MOTION_DETECT_SHADOWS: "0"
      BASELINE_DIFF_THRESHOLD: "0.06"
      DAY_BASELINE_DIFF_THRESHOLD: "0.18"
      DAYTIME_RODENT_MIN_CONF: "0.55"
      # Match yard's chair-FP fix — bumped from default 0.70 so weak
      # YOLO person hits (chairs, coats, tools) don't trip
      # human_heartbeat + suppress wildlife.
      EXCLUSION_MIN_CONF: "0.90"
      VLM_BACKEND: ollama
      OLLAMA_MODEL: qwen2.5vl:7b
      CLAUDE_MODEL: claude-sonnet-5
      CASCADE_CONFIRM_MODEL: claude-sonnet-5
      OLLAMA_URL: http://host.docker.internal:11434
      DETECTOR_INTERNAL_HOST: 0.0.0.0
      # Third detector needs its own internal HTTP port — yard=8101,
      # rooftop=8102, backyard=8103. Web fan-out registry keys on the
      # URL so this port must be unique across the compose network.
      DETECTOR_INTERNAL_PORT: 8103
      # Self-slew PTZ (backyard's own PTZ camera pans on positive
      # detection). Enabled 2026-08-09 after 6 zone polygons drawn +
      # per-preset PTZ presets saved on the camera. See
      # src/stream/self_slew.py for the lifecycle.
      SELF_SLEW_ENABLED: "true"
      # PTZ command target — camera_id=2 in the config maps to these
      # env vars. Jennov cams (Hikvision-family firmware, ONVIF-only)
      # don't have Dahua CGI; go through /onvif/ptz SOAP with
      # WS-Security digest instead.
      PTZ_HOST_2: "192.168.1.118"
      PTZ_USER_2: "admin"
      PTZ_PASS_2: "123456"
      PTZ_BACKEND_2: "onvif"
      # ONVIF media ProfileToken. Discover via GetProfiles if this
      # camera model differs; MainStream is the Jennov default.
      PTZ_ONVIF_PROFILE_2: "MainStream"
    expose:
      - "8103"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8103/internal/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: wildlife-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Comma-separated so the sidecar can fan-out /status + fan-in /api/alerts.
      # Order defines display order in the UI.
      DETECTOR_URLS: http://detector-yard:8101,http://detector-rooftop:8102,http://detector-backyard:8103
      # Back-compat: legacy single-detector consumers read this one.
      DETECTOR_INTERNAL_URL: http://detector-yard:8101
      PREVIEW_HOST: 0.0.0.0
      PREVIEW_PORT: 8100
      # DATABASE_URL lives in .env — see the anchor comment on
      # `x-detector-common.env_file` for the YAML-anchor merge rationale.
      SNAPSHOT_DIR: /app/snapshots
      # NVR playback channel per camera — used by /api/alerts/<id>/playback-url
      # to build the rtsp:// URL that opens the alert's timestamp in VLC/mpv.
      # Set to the channel each camera records to on the Amcrest NVR
      # (192.168.1.148 per .env). Without these, the endpoint returns a
      # 'note' warning and defaults to channel 1 (likely wrong).
      NVR_CHANNEL_YARD: "5"
      NVR_CHANNEL_ROOFTOP: "6"
      NVR_CHANNEL_BACKYARD: "8"
    volumes:
      - ./data:/app/data
      - ./snapshots:/app/snapshots:ro
      - ./clips:/app/clips:ro
      - ./logs:/app/logs
      - ./config:/app/config
      # scripts/ bind-mounted (not COPYed) so operational one-shots like
      # backfill_tp_clips.py can be edited on the host and run in-container
      # via `docker compose exec web python scripts/…` without a rebuild.
      - ./scripts:/app/scripts:ro
    ports:
      - "8100:8100"   # user-facing UI
    depends_on:
      # `service_healthy` (not `service_started`) is load-bearing here: the
      # DetectorRegistry probes each detector's /internal/status ONCE at
      # web startup to learn its camera_id. If a probe fails, the registry
      # silently falls back to positional `cam0`, `cam1` — those names
      # match zero rows in the alerts table, so /api/alerts/counts starts
      # returning {"cam0":0,"cam1":0} and the unread badge shows 0 forever.
      # Waiting for the detectors' healthcheck to pass eliminates the race.
      # See src/web_service.py:DetectorRegistry for the code-level retry
      # backstop and the underlying "silent fallback" comment.
      detector-yard:
        condition: service_healthy
      detector-rooftop:
        condition: service_healthy
      detector-backyard:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/status', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Clip archiver ────────────────────────────────────────────────────
  # Bounded-context service that pulls NVR playback footage to local
  # disk before the NVR's FIFO rotation eats it. Triggered by
  # LISTEN/NOTIFY on the `archive_queue` channel — web publishes on
  # every TP-verified label, this service consumes and runs ffmpeg.
  #
  # No camera bindings, no OpenCV — one Python process listening on a
  # DB channel and forking ffmpeg. Missed notifies are recovered by
  # scripts/backfill_tp_clips.py; no durable outbox needed for MVP.
  archiver:
    build:
      context: .
      dockerfile: docker/archiver/Dockerfile
    container_name: wildlife-archiver
    restart: unless-stopped
    env_file:
      # AMCREST_HOST/USER/PASS for RTSP auth, DATABASE_URL for LISTEN,
      # NVR_CHANNEL_* for per-camera routing. See .env.example.
      - .env
    environment:
      CLIPS_DIR: /app/clips
      # NVR playback channel per camera — same values as web's block,
      # required so archiver knows which NVR channel to pull per camera.
      NVR_CHANNEL_YARD: "5"
      NVR_CHANNEL_ROOFTOP: "6"
      NVR_CHANNEL_BACKYARD: "8"
    volumes:
      - ./clips:/app/clips
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  # Bind-mounts on ./data, ./snapshots, ./logs, ./clips live in the
  # service blocks. `models` stays a named volume — YOLO auto-downloaded
  # weights don't need host visibility.
  models:
  # `pg-data` is a named volume (not a bind-mount) so Postgres files live
  # inside the WSL2 ext4 filesystem, avoiding the 9P + SQLite lock issues
  # that motivated this migration in the first place. Backup via
  # `docker compose exec postgres pg_dump ...` — online, no downtime.
  pg-data:
